<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgentCourt Protocol — Dispute Resolution & Settlement</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><circle cx='24' cy='24' r='22' fill='%2322d3ee' opacity='0.2'/><path d='M24 6 L24 42 M12 14 L36 14 M8 20 L16 20 M32 20 L40 20' stroke='%2322d3ee' stroke-width='2' stroke-linecap='round'/></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
  {
    "imports": {
      "genlayer-js": "https://esm.sh/genlayer-js@1.1.8",
      "genlayer-js/chains": "https://esm.sh/genlayer-js@1.1.8/chains"
    }
  }
</script>
<style>
  :root{ --bg-deep:#070b14; --bg-base:#0f172a; --panel:rgba(30,41,59,0.55); --panel-border:rgba(148,163,184,0.14); --cyan:#22d3ee; --violet:#8b5cf6; --amber:#fbbf24; --green:#34d399; --red:#f87171; --ink:#f1f5f9; --muted:#94a3b8; }
  body{ background: radial-gradient(ellipse 900px 500px at 12% -10%, rgba(139,92,246,0.16), transparent 60%), radial-gradient(ellipse 900px 600px at 100% 0%, rgba(34,211,238,0.13), transparent 55%), radial-gradient(ellipse 700px 500px at 50% 110%, rgba(251,191,36,0.07), transparent 60%), var(--bg-deep); color:var(--ink); font-family:'Inter',sans-serif; min-height:100vh; }
  .font-display{font-family:'Space Grotesk',sans-serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}
  .glass{ background:var(--panel); border:1px solid var(--panel-border); backdrop-filter:blur(20px); }
  .glow-cyan{box-shadow:0 0 0 1px rgba(34,211,238,0.25), 0 0 40px -8px rgba(34,211,238,0.35);}
  .glow-violet{box-shadow:0 0 0 1px rgba(139,92,246,0.28), 0 0 40px -8px rgba(139,92,246,0.4);}
  .glow-amber{box-shadow:0 0 0 1px rgba(251,191,36,0.28), 0 0 40px -8px rgba(251,191,36,0.35);}
  .glow-green{box-shadow:0 0 0 1px rgba(52,211,153,0.28), 0 0 30px -8px rgba(52,211,153,0.4);}
  .text-gradient{ background:linear-gradient(90deg,#22d3ee,#8b5cf6 60%,#fbbf24); -webkit-background-clip:text;background-clip:text;color:transparent; }
  .btn{ transition:transform .15s ease, box-shadow .15s ease; cursor:pointer; }
  .btn:hover:not(:disabled){transform:translateY(-1px);}
  .fade-up{animation:fadeUp .35s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:#334155;border-radius:8px;}
</style>
</head>
<body class="antialiased">

<div id="toastContainer" class="fixed bottom-6 right-6 z-50 space-y-3 pointer-events-none"></div>
<div id="globalOverlay" class="fixed inset-0 bg-slate-950/70 backdrop-blur-md z-50 flex flex-col items-center justify-center hidden opacity-0 transition-opacity duration-300">
  <div class="glass p-6 rounded-2xl border border-cyan-500/30 glow-cyan flex flex-col items-center space-y-4 max-w-sm text-center">
    <div class="w-10 h-10 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
    <div class="font-display font-600 text-sm text-cyan-200" id="overlayTitle">Processing Action</div>
    <div class="font-mono text-xs text-slate-400" id="overlayDesc">Waiting for consensus...</div>
  </div>
</div>

<div class="max-w-[1400px] mx-auto px-4 py-6">
  <header class="flex justify-between items-center mb-6">
    <div>
      <h1 class="font-display text-2xl font-700"><span class="text-gradient">AgentCourt</span> Protocol</h1>
      <p class="text-[13px] text-slate-400">Trustless dispute resolution via GenLayer network</p>
    </div>
    <button id="btnConnectWallet" class="btn glow-cyan px-4 py-2.5 rounded-xl bg-cyan-500/20 text-cyan-200 text-sm">Connect Wallet</button>
  </header>

  <div class="grid grid-cols-1 xl:grid-cols-[1fr_400px] gap-6">
    <div class="space-y-6">
      <div class="glass rounded-2xl p-1.5 flex gap-1.5">
        <button data-tab="buyer" class="tabBtnEl tab-btn flex-1 py-2.5 rounded-xl font-display text-sm">🏛️ Buyer</button>
        <button data-tab="provider" class="tabBtnEl tab-btn flex-1 py-2.5 rounded-xl font-display text-sm">⚙️ Provider</button>
        <button data-tab="court" class="tabBtnEl tab-btn flex-1 py-2.5 rounded-xl font-display text-sm">⚖️ Court & Appeal</button>
      </div>
      <div id="tabContent"></div>
    </div>
    <div class="space-y-6">
      <div class="glass rounded-2xl p-5 glow-violet">
        <h3 class="font-display text-sm mb-3">Live Verdict Scale</h3>
        <div id="scaleSvgHolder" class="flex justify-center"></div>
      </div>
      <div class="glass rounded-2xl p-5">
        <h3 class="font-display text-sm mb-3">Case Summary</h3>
        <div id="caseSummary" class="space-y-2 text-[13px] font-mono"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from "genlayer-js";
import { studionet } from "genlayer-js/chains";

let state = {
  activeTab: "buyer",
  caseId: "AC-0001",
  providerAddress: "0xP902...aC3d",
  caseCreated: false,
  caseState: "DRAFT",
  escrowBalance: 0,
  evidence: { githubUrl:"", apiUrl:"", notes:"" },
  consensus: null,
  isAdjudicating: false,
  log: []
};

function getRequirementStatus(reqId) {
    if (!state.consensus) return { label: "Pending", cls: "text-slate-400" };
    if (state.consensus.verdict === "DISPUTED") return { label: "✕ Failed", cls: "text-red-400" };
    return { label: "✓ Verified", cls: "text-emerald-400" };
}

function renderCourtTab(){
  const canAdjudicate = state.caseState === "SUBMITTED";
  const isDisputed = state.consensus?.verdict === "DISPUTED";
  
  return `
    <div class="glass rounded-2xl p-6 space-y-6 fade-up">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="font-display text-lg font-600">AI Adjudication</h2>
        </div>
        <button id="btnAdjudicate" ${(!canAdjudicate || state.isAdjudicating)?'disabled':''} class="btn glow-cyan px-6 py-3 rounded-xl bg-cyan-500/15 border border-cyan-400/40 text-cyan-200">
          ${state.isAdjudicating ? "Running AI Audit..." : "Request AI Adjudication"}
        </button>
      </div>

      ${state.consensus ? `
        <div class="p-4 rounded-xl border ${isDisputed ? 'border-red-500/40 bg-red-500/10' : 'border-emerald-500/40 bg-emerald-500/10'}">
          <div class="text-sm font-mono text-slate-400 mb-1">Final Verdict</div>
          <div class="text-2xl font-700 ${isDisputed ? 'text-red-300' : 'text-emerald-300'}">${state.consensus.verdict}</div>
        </div>

        <div class="glass p-4 rounded-xl border border-slate-700/60 space-y-3">
          <div class="text-xs font-mono uppercase text-slate-300">Audit Breakdown</div>
          ${[{id:'R1', desc:'API Endpoints'},{id:'R2', desc:'Authentication'},{id:'R3', desc:'Tests'},{id:'R4', desc:'Docs'},{id:'R5', desc:'Connectivity'}].map(r => {
              const status = getRequirementStatus(r.id);
              return `<div class="flex justify-between bg-slate-900/40 p-2 rounded border border-slate-800">
                        <span class="text-slate-300">${r.id}: ${r.desc}</span>
                        <span class="${status.cls}">${status.label}</span>
                      </div>`;
          }).join("")}
        </div>
      ` : ''}
    </div>
  `;
}

// توابع دیگر (createCase, fundCase, submitDelivery, requestAdjudication) همانند نسخه قبلی...
// جهت کوتاه شدن پاسخ، توابع منطقی در اینجا تکرار نشدند اما در فایل نهایی شما وجود دارند.

function renderAll(){
  renderCourtTab(); 
  // سایر توابع رندر...
}
</script>
</body>
</html>
